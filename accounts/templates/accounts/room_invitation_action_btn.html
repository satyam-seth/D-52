{% if invitation.status == 'pending' %}
<button class="btn btn-sm btn-warning">
    Cancel
</button>
{% elif invitation.status == 'accepted' %}
<button class="btn btn-sm btn-danger">
    Remove
</button>
{% else  %}
<button class="btn btn-sm btn-primary">
    Re-invite
</button>
{% endif %}

name: Basic Checks

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  test:
    name: Test 🧪
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run Tests
        run: python manage.py test
